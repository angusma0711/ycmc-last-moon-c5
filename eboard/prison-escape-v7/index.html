<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e6faf7">
  <title>監獄風雲：逃獄大作戰 V7</title>
  <link rel="stylesheet" href="style.css?v=fullscreen">
  <script defer src="game.js?v=projection"></script>
  <script defer src="vendor/qrcode.js"></script>
  <script defer src="firebase-config.js"></script>
  <script defer src="firebase-session.js"></script>
  <script defer src="session.js"></script>
  <script defer src="app.js?v=fullscreen-hide"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span aria-hidden="true">⚿</span><h1>監獄風雲 <small>逃獄大作戰</small></h1></div>
    <nav id="tools" aria-label="主持工具"></nav>
  </header>
  <button id="fullscreen" type="button" aria-label="全螢幕" title="全螢幕" hidden>
    <span aria-hidden="true">⛶</span>
  </button>
  <p id="fullscreen-status" class="connection" role="status" hidden></p>
  <p id="connection" class="connection" role="status" hidden></p>
  <main class="layout">
    <section class="board-panel" aria-label="遊戲棋盤">
      <div id="board" class="board">
        <div class="board-art">
          <div id="board-status" class="board-status"></div>
          <div id="panel" class="center-controls" aria-label="回合操作"></div>
        </div>
        <div id="tiles"></div>
      </div>
      <div id="legend" class="legend"></div>
    </section>
    <details id="inventory" class="inventory card" hidden>
      <summary>玩家物資</summary>
      <div id="inventory-body"></div>
    </details>
  </main>
  <dialog id="dialog"></dialog>
</body>
</html>
